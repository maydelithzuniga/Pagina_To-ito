spring.application.name=ApiRest_venta

# ---------------------------------------------------------------------------
# Base de datos: se usa H2 en memoria porque el proyecto es una landing page y
# no necesita persistencia real entre reinicios. Aun asi se usa Spring Data
# JPA con repositorios reales, y el catalogo/testimonios se cargan al iniciar
# la aplicacion (ver config/DataLoader.java).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:toitodb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Consola H2 disponible en /h2-console (solo util en desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Seguridad: usuario administrador (autenticacion HTTP Basic) usado para
# gestionar el catalogo y moderar testimonios. Se recomienda sobreescribir
# estos valores con variables de entorno en produccion.
# ---------------------------------------------------------------------------
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin123}

# ---------------------------------------------------------------------------
# Datos de contacto usados por el call to action hacia WhatsApp
# ---------------------------------------------------------------------------
app.contacto.whatsapp.numero=${WHATSAPP_NUMERO:51999999999}
app.contacto.whatsapp.mensaje=${WHATSAPP_MENSAJE:Hola, estoy interesado en sus estampados y productos personalizados de To-ito}

# ---------------------------------------------------------------------------
# CORS: origenes permitidos para consumir la API desde el frontend
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
